<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Dreamers</title>
  <meta name="description" content="Pixel Dreamers, a small studio making offline mobile games.">
  <style>
    :root { --bg: #fbfaf7; --text: #1f2328; --muted: #57606a; --accent: #6b4fd8; --line: #e4e1da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15151a; --text: #e8e6e3; --muted: #a3a1a8; --accent: #a996ff; --line: #2b2a33; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 16px 48px; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    nav { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Pixel Dreamers</h1>
    <p class="muted">A small studio making offline mobile games.</p>
    <p>Our games play without an internet connection and keep your progress on your device.</p>
    <nav>
      <a href="privacy.html">Privacy policy</a>
      <a href="mailto:pixeldreamersgamestudio@gmail.com">pixeldreamersgamestudio@gmail.com</a>
    </nav>
  </main>
</body>
</html>
